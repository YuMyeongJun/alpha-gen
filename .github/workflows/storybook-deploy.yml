name: Deploy Storybook to GitHub Pages

# NOTE:
# - One-time manual setup required: Settings → Pages → Source = "GitHub Actions".
#   Until that's done, the `deploy` job's actions/deploy-pages@v4 step will 404.
# - The `branches` trigger below includes `feature/dashboard-uplift` for this
#   working branch. Prune it back to just `main` once this branch merges, or
#   this workflow will keep firing on a stale branch name.

on:
  push:
    branches: [main, feature/dashboard-uplift]
    paths:
      - "frontend/**"
      - ".github/workflows/storybook-deploy.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
          cache-dependency-path: frontend/yarn.lock
      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: Build app
        working-directory: frontend
        run: yarn build
      - name: Build Storybook
        working-directory: frontend
        run: yarn build-storybook
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
