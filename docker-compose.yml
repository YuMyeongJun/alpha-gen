services:
  agent:
    build: .
    container_name: alpha-gen-agent
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - TZ=Asia/Seoul

  dashboard:
    build: .
    container_name: alpha-gen-dashboard
    command: streamlit run dashboard.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    environment:
      - TZ=Asia/Seoul
    depends_on:
      - agent
